<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>회원가입 - 치지직</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
	<h1>회원가입</h1>
	<p class="error-message" role="alert" th:text="${errorMessage}"></p>
	<form th:action="@{/signup}" method="post">
		<p>
			<label for="username">아이디</label>
			<input id="username" type="text" name="username" th:value="${username}" autocomplete="username"
				   maxlength="20"/>
			<small>영문 소문자·숫자·밑줄(_) 4~20자</small>
		</p>
		<p>
			<label for="password">비밀번호</label>
			<input id="password" type="password" name="password" autocomplete="new-password" maxlength="64"/>
			<small>8~64자</small>
		</p>
		<p>
			<label for="passwordConfirm">비밀번호 확인</label>
			<input id="passwordConfirm" type="password" name="passwordConfirm" autocomplete="new-password"
				   maxlength="64"/>
		</p>
		<button type="submit">가입하기</button>
	</form>
	<p>이미 계정이 있나요? <a href="/login">로그인</a></p>
</main>
</body>
</html>
