<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>라이브 시작 - 치지직</title>
	<style>
		.video-frame {
			width: 100%;
			max-width: 640px;
			aspect-ratio: 9 / 16;
			background: #000;
		}

		.video-frame video {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.live-error {
			color: #c00;
		}

		.live-error[hidden],
		.watch-link[hidden] {
			display: none;
		}
	</style>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main id="live-broadcaster" th:attr="data-ice-servers=${iceServers}">
	<h1>라이브 시작</h1>
	<p>휴대폰 카메라와 마이크로 방송합니다. 카메라는 HTTPS 주소에서만 켤 수 있습니다.</p>
	<p class="live-error" role="alert" hidden="hidden"></p>
	<p>
		<label for="title">제목</label>
		<input id="title" type="text" name="title" maxlength="100"/>
	</p>
	<div class="video-frame">
		<video id="preview" autoplay="autoplay" playsinline="playsinline" muted="muted"></video>
	</div>
	<p class="live-status" aria-live="polite">카메라와 마이크를 켜 주세요.</p>
	<p>
		<button id="prepare-camera" type="button">카메라·마이크 켜기</button>
		<button id="start-live" type="button" disabled="disabled">방송 시작</button>
		<button id="end-live" type="button" disabled="disabled">방송 종료</button>
	</p>
	<p class="watch-link" hidden="hidden">시청 주소: <a href="#"></a></p>
	<p class="viewer-count" aria-live="polite">시청자 0명</p>
</main>
<script src="/js/live-broadcaster.js"></script>
</body>
</html>
