# ⑥ 데스크톱 클라이언트 OS별 패키지 빌드와 재생 확인. jpackage는 실행하는 OS용 패키지만 만들므로 OS별 러너에서 각각 만든다.
#   - Windows x64: app-image ZIP (chzzk-client-windows-x64.zip)
#   - macOS arm64(Apple Silicon): DMG (chzzk-client-macos-arm64.dmg)
# 만든 패키지 파일(사용자가 받을 그 파일)을 풀거나(ZIP) 마운트해(DMG), 시스템 Java 없이 실행해 확인한다.
#   러너 안의 작은 HTTP 서버(client/smoke/SmokeServer.java)가 목록 API와 실제 H.264/AAC MP4(Range 지원)를 준다.
#   확인: 목록 조회 → 라이브 항목은 재생 불가 분류 → 녹화 MP4 2초 재생 → 중간 탐색. 실패하면 작업이 실패한다.
# GitHub 러너(가상 머신)에서의 확인이며 실제 사용자 PC·Mac 실기기 확인을 대신하지 않는다. Releases 게시는 하지 않는다.
name: client-build

on:
  workflow_dispatch:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            task: packageWindowsZip
            artifact: client/build/dist/chzzk-client-windows-x64.zip
          - os: macos-latest
            label: macOS arm64
            task: packageMacDmg
            artifact: client/build/dist/chzzk-client-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Unit tests
        run: ./gradlew -p client --no-daemon test

      - name: Package
        id: package
        run: |
          ./gradlew -p client --no-daemon ${{ matrix.task }}
          ls -l client/build/dist

      # Windows Server 러너에는 AAC 디코더(Media Foundation)가 없어 재생 확인이 OS 때문에 실패한다(1차 확인에서 ERROR_MEDIA_AAC_FORMAT_UNSUPPORTED).
      # 그래서 Windows 패키지의 재생 확인은 데스크톱 Windows 11 러너(아래 windows-playback 작업)에서 한다.
      - name: Start local smoke server
        if: runner.os != 'Windows'
        run: |
          java client/smoke/SmokeServer.java 18080 client/smoke/sample-h264-aac.mp4 > smoke-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/api/broadcasts > /dev/null && break; sleep 1; done
          cat smoke-server.log
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-99' http://127.0.0.1:18080/videos/sample.mp4)
          echo "range request -> $code"; test "$code" = "206"

      - name: Playback smoke test (packaged artifact, no system Java)
        id: smoke
        if: runner.os != 'Windows'
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            rm -rf artifact-test && mkdir artifact-test
            unzip -q "${{ matrix.artifact }}" -d artifact-test
            app="artifact-test/chzzk-client/chzzk-client.exe"
          else
            hdiutil attach -nobrowse -readonly -mountpoint /tmp/chzzk-dmg "${{ matrix.artifact }}"
            app="/tmp/chzzk-dmg/chzzk-client.app/Contents/MacOS/chzzk-client"
          fi
          env -u JAVA_HOME PATH="/usr/bin:/bin:/c/Windows/System32:/c/Windows" \
            "$app" --smoke-test --server=http://127.0.0.1:18080 --smoke-log=smoke.log
          status=$?
          [ "$RUNNER_OS" = "macOS" ] && hdiutil detach /tmp/chzzk-dmg
          cat smoke.log
          grep -q "SMOKE PASS playback" smoke.log || status=1
          exit $status

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo "| 항목 | 결과 |"
            echo "| --- | --- |"
            echo "| 패키지 빌드 | ${{ steps.package.outcome }} |"
            echo "| 재생 확인(러너, 로컬 서버, 목록·재생·탐색) | ${{ runner.os == 'Windows' && 'windows-playback 작업(Windows 11)에서 확인' || steps.smoke.outcome }} |"
            echo "| 실제 사용자 PC/Mac 실기기 확인 | 이 워크플로에서는 하지 않음(NOT_TESTED) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-package
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-smoke-log
          path: |
            smoke.log
            smoke-server.log
          if-no-files-found: ignore

  # Windows x64 패키지(ZIP)의 재생 확인. 데스크톱 Windows 11 러너(Arm64)에서 위에서 만든 x64 ZIP을 받아
  # Windows의 x64 에뮬레이션으로, 시스템 Java 없이 실행한다(Windows Server 러너에는 AAC 디코더가 없음).
  windows-playback:
    needs: package
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # 이 JDK는 확인용 서버(SmokeServer.java)만 실행한다. Windows Arm64용 Temurin 25가 없어 21을 쓴다.
      # 앱은 패키지 안의 Java 25 런타임으로 실행된다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: windows-latest-package
          path: dist

      - name: Start local smoke server
        run: |
          java client/smoke/SmokeServer.java 18080 client/smoke/sample-h264-aac.mp4 > smoke-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/api/broadcasts > /dev/null && break; sleep 1; done
          cat smoke-server.log
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-99' http://127.0.0.1:18080/videos/sample.mp4)
          echo "range request -> $code"; test "$code" = "206"

      - name: Playback smoke test (x64 ZIP on Windows 11, no system Java)
        id: smoke
        run: |
          set +e
          mkdir artifact-test
          unzip -q dist/chzzk-client-windows-x64.zip -d artifact-test
          env -u JAVA_HOME PATH="/usr/bin:/bin:/c/Windows/System32:/c/Windows" \
            artifact-test/chzzk-client/chzzk-client.exe --smoke-test --server=http://127.0.0.1:18080 --smoke-log=smoke.log
          status=$?
          cat smoke.log
          grep -q "SMOKE PASS playback" smoke.log || status=1
          exit $status

      - name: Summary
        if: always()
        run: |
          {
            echo "### Windows x64 패키지 재생 확인 (windows-11-arm 러너, x64 에뮬레이션)"
            echo "| 항목 | 결과 |"
            echo "| --- | --- |"
            echo "| 재생 확인(러너, 로컬 서버, 목록·재생·탐색) | ${{ steps.smoke.outcome }} |"
            echo "| 실제 사용자 PC 확인 | 이 워크플로에서는 하지 않음(NOT_TESTED) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-11-smoke-log
          path: |
            smoke.log
            smoke-server.log
          if-no-files-found: ignore
