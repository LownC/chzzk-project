# ⑤ 여러 앱 인스턴스 앞의 부하 분산기. 분산 대상은 스케일러가 쓰는 upstream.d/app-servers.conf에 있다
# (scripts/autoscale/lb-upstream.ps1). 스케일러는 준비된 인스턴스만 넣고, 내릴 인스턴스는 먼저 빼서 nginx를 다시 읽게 한 뒤 내린다.
# 예전처럼 Docker DNS를 다시 조회하면 내려간 인스턴스가 몇 초 넘게 대상에 남아 502가 났다(docs/autoscale.md 3.1).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream chzzk_app {
        zone chzzk_app 64k;
        least_conn;
        include /etc/nginx/upstream.d/app-servers.conf;
    }

    # 영상 업로드(최대 500MB)
    client_max_body_size 510m;

    server {
        listen 80;

        location / {
            proxy_pass http://chzzk_app;
            proxy_http_version 1.1;
            # 앱의 WebSocket 같은 출처 검사가 브라우저 주소(Host)와 맞도록 원래 Host를 넘긴다.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 라이브 시그널링(/ws/live) WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            # 스케일 인은 대상에서 먼저 빼므로 여기에 기대지 않는다. 인스턴스가 갑자기 죽었을 때를 위해,
            # 연결을 2초 안에 못 맺으면 다른 인스턴스로 다시 보낸다(멱등 요청만, 최대 3번).
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            add_header X-Chzzk-Upstream $upstream_addr always;
        }
    }
}
