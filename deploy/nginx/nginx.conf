# ⑤ 여러 앱 인스턴스 앞의 부하 분산기. Docker 내장 DNS(127.0.0.11)로 "app" 이름을 5초마다 다시 조회해,
# 스케일러가 인스턴스를 늘리거나 줄이면 nginx를 다시 띄우지 않아도 분산 대상이 바뀐다(nginx 1.27.3+ upstream resolve).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream chzzk_app {
        zone chzzk_app 64k;
        least_conn;
        server app:8080 resolve max_fails=1 fail_timeout=5s;
    }

    # 영상 업로드(최대 500MB)
    client_max_body_size 510m;

    server {
        listen 80;

        location / {
            proxy_pass http://chzzk_app;
            proxy_http_version 1.1;
            # 앱의 WebSocket 같은 출처 검사가 브라우저 주소(Host)와 맞도록 원래 Host를 넘긴다.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 라이브 시그널링(/ws/live) WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            # 스케일 인으로 내려간 인스턴스는 DNS에서 빠지기 전(최대 5초) 잠깐 분산 대상에 남는다.
            # 연결을 2초 안에 못 맺으면 다른 인스턴스로 다시 보낸다(멱등 요청만, 최대 3번).
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            add_header X-Chzzk-Upstream $upstream_addr always;
        }
    }
}
