# ⑥ OCI VM의 nginx 사이트 설정. /etc/nginx/sites-available/chzzk 로 복사해 sites-enabled에 연결한다(README "OCI 배포").
# Cloudflare DNS는 DNS only(프록시 끔)라 브라우저가 이 nginx에 바로 접속한다. TLS는 Let's Encrypt 인증서로 여기서 끝낸다.
# 앱(Spring Boot)은 127.0.0.1:8080에서만 듣고(deploy 프로파일), 이 nginx가 보낸 X-Forwarded-*만 믿는다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 공개 서비스 남용 방지(최소 구성). 한 주소(IP)에서 오는 POST만 센다. GET(목록·시청·영상)은 제한하지 않는다.
#   - 회원가입·로그인 POST: 분당 10번(순간 5번 더)
#   - 영상 업로드 POST(/broadcasts): 시간당 20번(순간 3번 더). 파일 하나의 크기 한도(500MB)는 그대로다.
# 넘으면 429. DNS only라 접속 주소가 곧 브라우저 주소다.
map $request_method $chzzk_post_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $chzzk_post_client zone=chzzk_auth:10m rate=10r/m;
limit_req_zone $chzzk_post_client zone=chzzk_upload:10m rate=20r/h;
limit_req_status 429;

# 80: 인증서 발급·갱신(certbot standalone은 nginx를 잠시 멈추고 80을 직접 씀) 외에는 https로 보낸다.
server {
    listen 80;
    listen [::]:80;
    server_name chzzk.lowndev.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chzzk.lowndev.com;

    ssl_certificate     /etc/letsencrypt/live/chzzk.lowndev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chzzk.lowndev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 기존 기능 그대로 영상 업로드 최대 500MB(앱 multipart 510MB 한도에 맞춤). 큰 본문은 디스크에 쌓지 않고 앱으로 바로 흘려보낸다.
    client_max_body_size 510m;
    client_body_timeout 300s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # 앱이 https 공개 주소로 링크·리다이렉트를 만들고, WebSocket 같은 출처 검사가 맞도록 원래 Host와 프로토콜을 넘긴다.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 라이브 시그널링(/ws/live) WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    location ~ ^/(login|signup)$ {
        limit_req zone=chzzk_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /broadcasts {
        limit_req zone=chzzk_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 녹화 영상: Range 요청(206, 탐색)은 기본으로 앱까지 그대로 전달된다. 큰 파일을 nginx 임시 파일에 쌓지 않는다.
    location /videos/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
